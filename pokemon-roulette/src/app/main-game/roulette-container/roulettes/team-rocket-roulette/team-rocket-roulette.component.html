<h1 class="title">{{ teamName }} Encounter</h1>

<app-wheel [items]="outcomes" (selectedItemEvent)="onItemSelected($event)"></app-wheel>

<ng-template #teamRockerModal let-modal>
  <div class="modal-body">
    <!-- The team's own colour, so Magma and Aqua are told apart at a glance rather than by
         reading the name — they alternate between encounters in the same run. -->
    <h1 class="modal-title" [style.color]="teamColour">{{ teamName }}</h1>

    <div class="team-rocket-panel">
      <div class="team-rocket-images">
        <img
          appImgFallback
          [src]="gruntSpriteUrl"
          [alt]="gruntName"
          height="170"
          />
      </div>

      <div class="team-rocket-text">
        <p><strong>{{ teamName }} {{ gruntName }}</strong> blocks your way!</p>
        @if (team) {
          <p>{{ team.boss.blurb }}</p>
        }
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" (click)="closeModal()">Ok</button>
    </div>
  </div>
</ng-template>
