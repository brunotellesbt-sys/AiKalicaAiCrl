<div class="mode-select">
  <h1 class="mode-title">{{ 'game.main.roulette.mode.title' | translate }}</h1>

  <div class="mode-options">
    @for (option of options; track option) {
      <button
        type="button"
        class="mode-card"
        (click)="select(option.mode)">
        <span class="mode-icon">{{ option.icon }}</span>
        <span class="mode-name">{{ option.titleKey | translate }}</span>
        <span class="mode-blurb">{{ option.blurbKey | translate }}</span>
      </button>
    }
  </div>
</div>
