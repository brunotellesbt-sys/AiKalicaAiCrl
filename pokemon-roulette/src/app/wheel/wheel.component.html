<div class="wheel-container">
    <p>{{ currentSegment | translate }}</p>
    <div class="canvas-container" [style.--pointer-space.px]="cursorWidth">
        <!-- Mirrors the pointer on the opposite side. The row centres its contents as a
             group, and the pointer only exists on the right, so without this the wheel
             itself sits half a pointer-width left of centre — read as the wheel drifting
             into one edge on a phone. -->
        <span class="pointer-balance" aria-hidden="true"></span>
        <canvas id="wheel"
                [width]="wheelWidth"
                [height]="canvasHeight"
                (click)="spinWheel()">
        </canvas>
        <canvas id="pointer"
                [width]="cursorWidth"
                [height]="canvasHeight">
        </canvas>
    </div>
    <button class="btn my-3"
            [ngClass]="(darkMode | async) ? 'btn-light' : 'btn-dark'"
            (click)="spinWheel()">
            {{ 'wheel.spin' | translate }}
    </button>
</div>
