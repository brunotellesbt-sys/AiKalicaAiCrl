<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#b7f3ff"/>
      <stop offset="1" stop-color="#c9ffd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="34" fill="url(#bg)"/>

  <!-- Card frame -->
  <rect x="22" y="22" width="468" height="468" rx="28" fill="rgba(255,255,255,0.55)" stroke="rgba(0,0,0,0.08)"/>


  <!-- Simple stylized portrait -->
  <g filter="url(#shadow)">
    <!-- Hair (spiky) -->
    <path d="M160 192c14-54 66-96 126-96 66 0 120 50 126 112-10-10-25-20-44-26-6-26-34-50-64-52-12-12-38-20-62-20-26 0-50 8-62 22-32 4-60 28-68 60-18 6-34 16-42 30z" fill="#2b2b2b"/>

    <!-- Face -->
    <circle cx="256" cy="244" r="86" fill="#ffd7c2" stroke="#d9a28c" stroke-width="6"/>

    <!-- Glasses -->
    <rect x="188" y="220" width="72" height="44" rx="12" fill="rgba(255,255,255,0.4)" stroke="#2b2b2b" stroke-width="6"/>
    <rect x="252" y="220" width="72" height="44" rx="12" fill="rgba(255,255,255,0.4)" stroke="#2b2b2b" stroke-width="6"/>
    <path d="M260 242h-8" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="224" cy="242" r="8" fill="#2b2b2b"/>
    <circle cx="288" cy="242" r="8" fill="#2b2b2b"/>

    <!-- Smile -->
    <path d="M222 278c12 16 54 16 66 0" fill="none" stroke="#b05a4b" stroke-width="8" stroke-linecap="round"/>

    <!-- Shirt -->
    <path d="M128 476c18-84 70-140 128-140s110 56 128 140" fill="#39b86b" stroke="#217a44" stroke-width="8"/>
    <path d="M198 336l58 58 58-58" fill="#f5f5f5" opacity="0.92"/>
  </g>

  <!-- Name -->
  <g>
    <rect x="44" y="420" width="180" height="52" rx="16" fill="rgba(0,0,0,0.18)"/>
    <text x="62" y="455" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="28" fill="#ffffff" font-weight="700">Max</text>
    <text x="132" y="455" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="16" fill="rgba(255,255,255,0.9)">Anime cameo</text>
  </g>
</svg>
