name: Deploy to GitHub Pages (from zip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Extract source ZIP (required)
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Put the zip at repo root and name it exactly: $ZIP_FILE"
            exit 1
          fi

          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          PROJECT_ROOT=$(find app -name package.json -print -quit | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      # ✅ STRONG PATCH: force Florian/Juliana trainer sprites from Bulbapedia icons
      - name: Force Gen 9 trainer icons (Florian/Juliana) from Bulbapedia
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          FLORIAN_URL: https://archives.bulbagarden.net/wiki/Special:FilePath/Florian_Icon_SV_Scarlet-3.png
          JULIANA_URL: https://archives.bulbagarden.net/wiki/Special:FilePath/Juliana_Icon_SV_Violet-1.png
        run: |
          set -e
          python3 - << 'PY'
          import os, re

          ROOT = os.getcwd()
          FLORIAN = os.environ["FLORIAN_URL"]
          JULIANA = os.environ["JULIANA_URL"]

          print("Forcing trainer icons:")
          print("  Florian:", FLORIAN)
          print("  Juliana:", JULIANA)

          # 1) Try to find the most likely mapping file(s)
          candidates = []
          for dirpath, _, filenames in os.walk(ROOT):
            for fn in filenames:
              low = fn.lower()
              if not (low.endswith(".ts") or low.endswith(".json") or low.endswith(".yml") or low.endswith(".yaml")):
                continue
              full = os.path.join(dirpath, fn)
              # prioritize common names
              if "trainer" in low and ("sprite" in low or "data" in low or "service" in low):
                candidates.append(full)
              elif low in ("trainer-sprite-data.ts","trainer_sprite_data.ts","trainer-sprites.ts","trainers.ts"):
                candidates.append(full)

          # Always include everything as fallback search pool later
          def iter_text_files():
            for dirpath, _, filenames in os.walk(ROOT):
              for fn in filenames:
                low = fn.lower()
                if low.endswith((".ts",".json",".yml",".yaml",".html",".css",".scss")):
                  yield os.path.join(dirpath, fn)

          touched = set()
          def write_if_changed(path, old, new):
            if new != old:
              with open(path,"w",encoding="utf-8") as f:
                f.write(new)
              touched.add(os.path.relpath(path, ROOT))
              return True
            return False

          # Robust replacers for many possible structures:
          # A) florian: "..."
          # B) "florian": "..."
          # C) male/female within gen9 object
          # D) mapping arrays or nested objects
          def force_key_value(text, key, url):
            # key: florian / juliana
            # Replace occurrences like: florian: '...'
            text2 = re.sub(rf"(\b{re.escape(key)}\b\s*:\s*)(['\"]).*?\2",
                           rf"\1'\g<0>'", text)  # placeholder, we'll override below
            # The above is tricky; do simpler direct pattern:
            return re.sub(rf"(\b{re.escape(key)}\b\s*:\s*)(['\"]).*?\2",
                          rf"\1'{url}'", text)

          def force_string_key_value(text, key, url):
            # "florian": "..."
            return re.sub(rf"(['\"])({re.escape(key)})\1\s*:\s*(['\"]).*?\3",
                          rf"'\2': '{url}'", text)

          # Extra: If there is a Gen 9 block like 9: { male: '...', female: '...' }
          def force_gen9_male_female(text):
            # very forgiving: find a "9:" block and replace male/female inside it
            # Works for objects like: 9: { male: '...', female: '...' }
            pat = re.compile(r"(9\s*:\s*\{)([\s\S]*?)(\})", re.MULTILINE)
            m = pat.search(text)
            if not m:
              return text
            head, body, tail = m.group(1), m.group(2), m.group(3)
            body2 = re.sub(r"(\bmale\b\s*:\s*)(['\"]).*?\2", rf"\1'{FLORIAN}'", body)
            body2 = re.sub(r"(\bfemale\b\s*:\s*)(['\"]).*?\2", rf"\1'{JULIANA}'", body2)
            if body2 == body:
              return text
            return text[:m.start()] + head + body2 + tail + text[m.end():]

          # 2) First pass: attempt direct fixes in candidate files (more reliable)
          for path in candidates:
            try:
              s = open(path,"r",encoding="utf-8").read()
            except Exception:
              continue
            original = s

            # Force common explicit keys
            s = force_key_value(s, "florian", FLORIAN)
            s = force_key_value(s, "juliana", JULIANA)
            s = force_string_key_value(s, "florian", FLORIAN)
            s = force_string_key_value(s, "juliana", JULIANA)

            # Force gen9 male/female if present
            s = force_gen9_male_female(s)

            # Also fix “swapped” lines in a broad way:
            # if a line mentions juliana and contains florian URL, replace with JULIANA
            s = re.sub(r"(juliana[^\n\r]{0,200})(https?://[^\s\"']*florian[^\s\"']*)",
                       rf"\1{JULIANA}", s, flags=re.IGNORECASE)
            # if a line mentions florian and contains juliana URL, replace with FLORIAN
            s = re.sub(r"(florian[^\n\r]{0,200})(https?://[^\s\"']*juliana[^\s\"']*)",
                       rf"\1{FLORIAN}", s, flags=re.IGNORECASE)

            write_if_changed(path, original, s)

          # 3) Fallback pass: scan all text files and replace any wrong URLs/filenames
          # Replace any Bulbagarden link that ends with a known Florian/Juliana asset
          florian_files = [
            "Florian_Icon_SV_Scarlet-3.png",
            "Violet_Florian.png",
            "Scarlet_Violet_Florian_The_Indigo_Disk.png",
            "florian-s.png",
            "florian.png",
          ]
          juliana_files = [
            "Juliana_Icon_SV_Violet-1.png",
            "Scarlet_Juliana.png",
            "Scarlet_Violet_Juliana_The_Indigo_Disk.png",
            "juliana-s.png",
            "juliana.png",
          ]

          def replace_any_file_url(text, filenames, url):
            for name in filenames:
              # Replace Special:FilePath/<name>
              text = re.sub(rf"https?://archives\.bulbagarden\.net/wiki/Special:FilePath/{re.escape(name)}",
                            url, text, flags=re.IGNORECASE)
              # Replace direct image URLs containing the filename anywhere
              text = re.sub(rf"https?://[^\s\"']*{re.escape(name)}",
                            url, text, flags=re.IGNORECASE)
            return text

          for path in iter_text_files():
            try:
              s = open(path,"r",encoding="utf-8").read()
            except Exception:
              continue
            original = s
            s = replace_any_file_url(s, florian_files, FLORIAN)
            s = replace_any_file_url(s, juliana_files, JULIANA)
            # Fix swapped line contexts again
            s = re.sub(r"(juliana[^\n\r]{0,200})(https?://[^\s\"']*florian[^\s\"']*)",
                       rf"\1{JULIANA}", s, flags=re.IGNORECASE)
            s = re.sub(r"(florian[^\n\r]{0,200})(https?://[^\s\"']*juliana[^\s\"']*)",
                       rf"\1{FLORIAN}", s, flags=re.IGNORECASE)

            write_if_changed(path, original, s)

          print(f"Trainer icon patch complete. Files changed: {len(touched)}")
          for p in sorted(list(touched))[:80]:
            print(" -", p)
          if len(touched) == 0:
            print("WARNING: No files changed. This likely means the trainer URLs are not stored in text files (.ts/.json/.yml/.html/.css/.scss) inside the zip, or are generated at runtime.")
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Install @angular/localize (match Angular version)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          CORE_VER=$(node -p "require('./package.json').dependencies?.['@angular/core'] || require('./package.json').devDependencies?.['@angular/core'] || ''")
          if [ -z "$CORE_VER" ]; then
            echo "ERROR: Could not detect @angular/core version from package.json"
            exit 1
          fi
          CORE_VER="${CORE_VER#^}"
          CORE_VER="${CORE_VER#~}"
          npm install @angular/localize@$CORE_VER --legacy-peer-deps

      - name: Build (relative paths for GitHub Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate index.html for Pages
        run: |
          set -e
          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 12 -type f -name index.html -print -quit)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            exit 1
          fi
          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> $GITHUB_ENV
          touch "$PAGES_DIR/.nojekyll"
          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
