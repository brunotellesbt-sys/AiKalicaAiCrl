name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (base-href para Pages)
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Detect Angular output dir
        run: |
          if [ -d "dist/pokemon-roulette/browser" ]; then
            echo "OUTPUT_DIR=dist/pokemon-roulette/browser" >> $GITHUB_ENV
          else
            echo "OUTPUT_DIR=dist/pokemon-roulette" >> $GITHUB_ENV
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
