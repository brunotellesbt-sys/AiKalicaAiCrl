name: Deploy to GitHub Pages (from zip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Extract source ZIP (required)
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Put the zip at repo root and name it exactly: $ZIP_FILE"
            exit 1
          fi

          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          PROJECT_ROOT=$(find app -name package.json -print -quit | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      # ✅ (já era seu) Gen 9 trainer faces local
      - name: Fix Gen 9 trainer icons (download Bulbapedia faces into assets)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          FLORIAN_SRC="https://archives.bulbagarden.net/wiki/Special:FilePath/Florian_Icon_SV_Scarlet-3.png"
          JULIANA_SRC="https://archives.bulbagarden.net/wiki/Special:FilePath/Juliana_Icon_SV_Violet-1.png"

          ASSET_DIR="src/assets/trainers/gen9"
          mkdir -p "$ASSET_DIR"

          curl -L --fail --retry 5 --retry-delay 2 -o "$ASSET_DIR/florian.png" "$FLORIAN_SRC"
          curl -L --fail --retry 5 --retry-delay 2 -o "$ASSET_DIR/juliana.png" "$JULIANA_SRC"

          python3 - << 'PY'
          import re, pathlib, sys

          p = pathlib.Path("src/app/services/trainer-service/trainer-sprite-data.ts")
          if not p.exists():
            print("ERROR: trainer-sprite-data.ts not found at expected path:", p)
            sys.exit(1)

          s = p.read_text(encoding="utf-8")
          florian_local = "assets/trainers/gen9/florian.png"
          juliana_local = "assets/trainers/gen9/juliana.png"

          pat = re.compile(r"(\b9\s*:\s*\{\s*)([\s\S]*?)(\s*\})", re.MULTILINE)
          m = pat.search(s)
          if not m:
            print("ERROR: Could not find generation 9 block in trainer-sprite-data.ts")
            sys.exit(1)

          head, body, tail = m.group(1), m.group(2), m.group(3)
          body2 = re.sub(r"(\bmale\b\s*:\s*)(['\"]).*?\2", rf"\1'{florian_local}'", body)
          body2 = re.sub(r"(\bfemale\b\s*:\s*)(['\"]).*?\2", rf"\1'{juliana_local}'", body2)

          s2 = s[:m.start()] + head + body2 + tail + s[m.end():]
          p.write_text(s2, encoding="utf-8")
          print("OK: Patched generation 9 trainer icons to local assets.")
          PY

      # ✅ NOVO: FORÇA KALOS RIVAL = SHAUNA (nome + sprite + traduções + quotes)
      - name: Force Kalos rival to Shauna (name + sprite + i18n)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          SHAUNA_SRC="https://archives.bulbagarden.net/wiki/Special:FilePath/XY_Shauna_Icon.png"
          ASSET_DIR="src/assets/trainers/kalos"
          mkdir -p "$ASSET_DIR"
          curl -L --fail --retry 5 --retry-delay 2 -o "$ASSET_DIR/shauna.png" "$SHAUNA_SRC"

          python3 - << 'PY'
          import json, re
          from pathlib import Path

          root = Path.cwd()
          shauna_asset = "assets/trainers/kalos/shauna.png"

          # 1) Patch rival-by-generation.ts (Gen 6)
          rb = root / "src/app/main-game/roulette-container/roulettes/rival-battle-roulette/rival-by-generation.ts"
          if not rb.exists():
            raise SystemExit("ERROR: rival-by-generation.ts not found")

          s = rb.read_text(encoding="utf-8")

          # Replace generation 6 block entirely (safe + deterministic)
          # We keep structure consistent with other gens.
          gen6_pat = re.compile(r"(\n\s*6\s*:\s*\{)([\s\S]*?)(\n\s*\}\s*,)", re.MULTILINE)
          m = gen6_pat.search(s)
          if not m:
            raise SystemExit("ERROR: Could not find generation 6 rival block")

          gen6_new = """
  6: {
    name: 'rival.shauna.name',
    sprite: 'assets/trainers/kalos/shauna.png',
    quotes: [
      "rival.shauna.quote1",
      "rival.shauna.quote2"
    ]
  },
""".rstrip("\n")

          s2 = s[:m.start()] + "\n" + gen6_new + s[m.end():]
          rb.write_text(s2, encoding="utf-8")
          print("OK: Gen6 rival replaced with Shauna in rival-by-generation.ts")

          # 2) Patch EN i18n (public/i18n/en.json): add rival.shauna + also neutralize old calem-serena name
          en = root / "public/i18n/en.json"
          if not en.exists():
            raise SystemExit("ERROR: public/i18n/en.json not found")

          data = json.loads(en.read_text(encoding="utf-8"))

          # Ensure nested structure
          data.setdefault("rival", {})
          data["rival"].setdefault("shauna", {})
          data["rival"]["shauna"]["name"] = "Shauna"
          data["rival"]["shauna"]["quote1"] = "I'll do my best to keep up with you!"
          data["rival"]["shauna"]["quote2"] = "Let's go! I want to see what makes you special!"

          # (optional) if something somewhere still references calem-serena, at least it won't be wrong
          data["rival"].setdefault("calem-serena", {})
          data["rival"]["calem-serena"]["name"] = "Shauna"

          en.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("OK: Added rival.shauna.* to EN i18n and neutralized calem-serena.name")
          PY

      # ✅ NOVO: Corrige Elite4/Champion/Items para não mostrar chave crua (aplica translate no HTML)
      - name: Fix Elite4/Champion/Item modals to translate keys
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          python3 - << 'PY'
          from pathlib import Path
          import re

          def patch_file(path: Path, replacements):
            s = path.read_text(encoding="utf-8")
            orig = s
            for (pat, rep) in replacements:
              s = re.sub(pat, rep, s, flags=re.MULTILINE)
            if s != orig:
              path.write_text(s, encoding="utf-8")
              print("Patched:", path)
            else:
              print("No changes needed:", path)

          elite_html = Path("src/app/main-game/roulette-container/roulettes/elite-four-battle-roulette/elite-four-battle-roulette.component.html")
          champ_html = Path("src/app/main-game/roulette-container/roulettes/champion-battle-roulette/champion-battle-roulette.component.html")

          # Elite 4 modal: name + alt + quotes translated
          patch_file(elite_html, [
            (r"\{\{\s*currentElite\.name\s*\}\}", r"{{ currentElite.name | translate }}"),
            (r'alt="\{\{\s*currentElite\.name\s*\}\}"', r'alt="{{ currentElite.name | translate }}"'),
            (r"\{\{\s*quote\s*\}\}", r"{{ quote | translate }}"),
            # Item modal: text + description (avoid items.potion.name raw)
            (r"\{\{\s*currentItem\.text\s*\}\}", r"{{ currentItem.text | translate }}"),
            (r"\{\{\s*currentItem\.description\s*\}\}", r"{{ currentItem.description | translate }}"),
          ])

          # Champion modal: name + alt + quotes translated + items too
          patch_file(champ_html, [
            (r"\{\{\s*champion\.name\s*\}\}", r"{{ champion.name | translate }}"),
            (r'alt="\{\{\s*champion\.name\s*\}\}"', r'alt="{{ champion.name | translate }}"'),
            (r"\{\{\s*quote\s*\}\}", r"{{ quote | translate }}"),
            (r"\{\{\s*currentItem\.text\s*\}\}", r"{{ currentItem.text | translate }}"),
            (r"\{\{\s*currentItem\.description\s*\}\}", r"{{ currentItem.description | translate }}"),
          ])
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Install @angular/localize (match Angular version)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          CORE_VER=$(node -p "require('./package.json').dependencies?.['@angular/core'] || require('./package.json').devDependencies?.['@angular/core'] || ''")
          if [ -z "$CORE_VER" ]; then
            echo "ERROR: Could not detect @angular/core version from package.json"
            exit 1
          fi
          CORE_VER="${CORE_VER#^}"
          CORE_VER="${CORE_VER#~}"
          npm install @angular/localize@$CORE_VER --legacy-peer-deps

      - name: Build (relative paths for GitHub Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate index.html for Pages
        run: |
          set -e
          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 12 -type f -name index.html -print -quit)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            exit 1
          fi
          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> $GITHUB_ENV
          touch "$PAGES_DIR/.nojekyll"
          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
