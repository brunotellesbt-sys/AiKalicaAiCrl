name: Deploy GitHub Pages (from zip)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract ZIP (skip node_modules to speed up)
        shell: bash
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repo root."
            exit 1
          fi

          rm -rf app
          mkdir -p app

          # NÃO extrai node_modules (otimiza muito), mas o ZIP continua igual no repo
          unzip -q "$ZIP_FILE" -d app -x "node_modules/*" "*/node_modules/*"

          PROJECT_ROOT="$(find app -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside extracted zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (prefer npm ci)
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (relative paths for Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate dist for Pages
        shell: bash
        run: |
          set -e
          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -type f -name index.html -print -quit)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 4 -type d -print || true
            exit 1
          fi
          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> $GITHUB_ENV
          touch "$PAGES_DIR/.nojekyll"
          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
