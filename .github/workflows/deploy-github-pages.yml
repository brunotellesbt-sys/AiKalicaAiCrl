name: Deploy to GitHub Pages (from zip)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            app/**/package-lock.json
            app/**/npm-shrinkwrap.json

      - name: Extract source ZIP (required)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Put the zip at repo root and name it exactly: $ZIP_FILE"
            exit 1
          fi

          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          PROJECT_ROOT="$(find app -name package.json -print -quit | xargs dirname || true)"
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          # (Opcional) Se o zip vier com node_modules, isso evita conflitos/arquivos antigos.
          rm -rf node_modules

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Install @angular/localize (match Angular version)
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          CORE_VER=$(node -p "require('./package.json').dependencies?.['@angular/core'] || require('./package.json').devDependencies?.['@angular/core'] || ''")
          if [ -z "$CORE_VER" ]; then
            echo "ERROR: Could not detect @angular/core version from package.json"
            exit 1
          fi

          CORE_VER="${CORE_VER#^}"
          CORE_VER="${CORE_VER#~}"

          npm install "@angular/localize@$CORE_VER" --legacy-peer-deps

      - name: Build (relative paths for GitHub Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set -euo pipefail
          npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate index.html for Pages
        shell: bash
        run: |
          set -euo pipefail

          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 12 -type f -name index.html -print -quit || true)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            echo "Dist contents:"
            find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 4 -type d -print || true
            exit 1
          fi

          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> "$GITHUB_ENV"

          # Evita Jekyll interferindo com paths
          touch "$PAGES_DIR/.nojekyll"

          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
