name: Deploy Pokémon Roulette

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Recomendado para Angular 19

      - name: Extract source ZIP
        run: |
          set -e
          unzip -q "$ZIP_FILE" -d app
          # Localiza a pasta que contém o package.json
          PROJECT_ROOT=$(find app -name package.json -print -quit | xargs dirname)
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Fix Strict Template Errors (NG5)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          # Garante que o pipe translate receba uma string, mesmo que o líder seja undefined
          sed -i "s/currentLeader?.name | translate/(currentLeader?.name || '') | translate/g" src/app/main-game/game-over/game-over.component.html
          sed -i "s/currentElite.name | translate/(currentElite.name || '') | translate/g" src/app/main-game/roulette-container/roulettes/elite-four-battle-roulette/elite-four-battle-roulette.component.html
          sed -i "s/champion.name | translate/(champion.name || '') | translate/g" src/app/main-game/roulette-container/roulettes/champion-battle-roulette/champion-battle-roulette.component.html

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Build Application
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm run build -- --configuration production --base-href "./"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # O caminho de saída padrão do Angular 19 é dist/[nome-do-projeto]/browser
          path: ${{ env.PROJECT_ROOT }}/dist/pokemon-roulette/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
