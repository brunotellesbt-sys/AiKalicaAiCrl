name: Deploy to GitHub Pages (from zip)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Extract source ZIP (required)
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Put the zip at repo root and name it exactly: $ZIP_FILE"
            exit 1
          fi

          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          PROJECT_ROOT=$(find app -name package.json -print -quit | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      # ✅ NEW: Patch Florian/Juliana icons from Bulbapedia/Bulbagarden Archives (face icons)
      - name: Patch Gen 9 trainer icons (Florian/Juliana) from Bulbapedia
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e

          FLORIAN_URL="https://archives.bulbagarden.net/wiki/Special:FilePath/Florian_Icon_SV_Scarlet-3.png"
          JULIANA_URL="https://archives.bulbagarden.net/wiki/Special:FilePath/Juliana_Icon_SV_Violet-1.png"

          echo "Using:"
          echo "  Florian: $FLORIAN_URL"
          echo "  Juliana: $JULIANA_URL"

          python3 - << 'PY'
          import os, re, sys

          root = os.getcwd()

          florian_url = os.environ.get("FLORIAN_URL")
          juliana_url = os.environ.get("JULIANA_URL")

          # Fallback if env not passed (should be passed)
          if not florian_url:
            florian_url = "https://archives.bulbagarden.net/wiki/Special:FilePath/Florian_Icon_SV_Scarlet-3.png"
          if not juliana_url:
            juliana_url = "https://archives.bulbagarden.net/wiki/Special:FilePath/Juliana_Icon_SV_Violet-1.png"

          # Any older URLs / names we want to replace if they appear anywhere
          # (these have appeared in earlier zips)
          florian_needles = [
            "Violet_Florian.png",
            "Scarlet_Violet_Florian_The_Indigo_Disk.png",
            "Florian_Icon_SV_Scarlet-3.png",
          ]
          juliana_needles = [
            "Scarlet_Juliana.png",
            "Scarlet_Violet_Juliana_The_Indigo_Disk.png",
            "Juliana_Icon_SV_Violet-1.png",
          ]

          # Regexes that catch any Bulbagarden/Bulbapedia links that point to those files
          def build_regex(names):
            escaped = [re.escape(n) for n in names]
            # match URL that ends with one of the filenames
            return re.compile(r"(https?://[^\s\"']+?(?:%s))" % ("|".join(escaped)), re.IGNORECASE)

          re_florian = build_regex(florian_needles)
          re_juliana = build_regex(juliana_needles)

          # Also catch common “wrong assignment” patterns:
          # - if code sets juliana sprite URL equal to something containing "florian"
          # - or florian equal to something containing "juliana"
          re_juliana_wrong = re.compile(r"(juliana[^\\n\\r]{0,200})(https?://[^\\s\"']+florian[^\\s\"']+)", re.IGNORECASE)
          re_florian_wrong = re.compile(r"(florian[^\\n\\r]{0,200})(https?://[^\\s\"']+juliana[^\\s\"']+)", re.IGNORECASE)

          touched = 0
          changed_files = []

          for dirpath, _, filenames in os.walk(root):
            for fn in filenames:
              if not (fn.endswith(".ts") or fn.endswith(".html") or fn.endswith(".json") or fn.endswith(".yml") or fn.endswith(".yaml")):
                continue
              path = os.path.join(dirpath, fn)
              try:
                with open(path, "r", encoding="utf-8") as f:
                  s = f.read()
              except Exception:
                continue

              original = s

              # Replace any explicit older URLs that point to Florian/Juliana assets
              s = re_florian.sub(florian_url, s)
              s = re_juliana.sub(juliana_url, s)

              # Fix accidental swapped assignment if present in a line-context
              s = re_juliana_wrong.sub(lambda m: m.group(1) + juliana_url, s)
              s = re_florian_wrong.sub(lambda m: m.group(1) + florian_url, s)

              if s != original:
                with open(path, "w", encoding="utf-8") as f:
                  f.write(s)
                touched += 1
                changed_files.append(os.path.relpath(path, root))

          print(f"Patched files: {touched}")
          for p in changed_files[:50]:
            print(" -", p)
          if touched == 0:
            # Not fatal. It might already be correct inside the zip.
            print("No files needed patching (icons may already be correct).")
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Install @angular/localize (match Angular version)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          CORE_VER=$(node -p "require('./package.json').dependencies?.['@angular/core'] || require('./package.json').devDependencies?.['@angular/core'] || ''")
          if [ -z "$CORE_VER" ]; then
            echo "ERROR: Could not detect @angular/core version from package.json"
            exit 1
          fi
          CORE_VER="${CORE_VER#^}"
          CORE_VER="${CORE_VER#~}"
          npm install @angular/localize@$CORE_VER --legacy-peer-deps

      - name: Build (relative paths for GitHub Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate index.html for Pages
        run: |
          set -e
          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 12 -type f -name index.html -print -quit)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            exit 1
          fi
          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> $GITHUB_ENV
          touch "$PAGES_DIR/.nojekyll"
          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
