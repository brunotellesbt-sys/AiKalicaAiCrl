name: Deploy to GitHub Pages (from zip)

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ZIP_FILE: pokemon-roulette-source.zip

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Extract source ZIP (required)
        run: |
          set -e
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            echo "Put the zip at repo root and name it exactly: $ZIP_FILE"
            exit 1
          fi

          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          PROJECT_ROOT=$(find app -name package.json -print -quit | xargs dirname)
          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: package.json not found inside zip."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project root: $PROJECT_ROOT"
          ls -la "$PROJECT_ROOT"

      # ✅ FIX ONLY: Elite4 + Champion showing raw translation keys (elite4.xxx.name / champion.xxx.name)
      - name: Fix Elite4 + Champion templates (translate names/quotes only)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          python3 - << 'PY'
          from pathlib import Path
          import re

          def patch(path: Path, pat: str, rep: str):
            s = path.read_text(encoding="utf-8")
            s2 = re.sub(pat, rep, s, flags=re.MULTILINE)
            if s2 != s:
              path.write_text(s2, encoding="utf-8")
              print("Patched:", path)
            else:
              print("No changes needed:", path)

          elite_html = Path("src/app/main-game/roulette-container/roulettes/elite-four-battle-roulette/elite-four-battle-roulette.component.html")
          champ_html = Path("src/app/main-game/roulette-container/roulettes/champion-battle-roulette/champion-battle-roulette.component.html")

          if not elite_html.exists():
            raise SystemExit(f"ERROR: missing {elite_html}")
          if not champ_html.exists():
            raise SystemExit(f"ERROR: missing {champ_html}")

          # Elite Four
          patch(elite_html, r"\{\{\s*currentElite\.name\s*\}\}(?!\s*\|\s*translate)", r"{{ currentElite.name | translate }}")
          patch(elite_html, r'alt="\{\{\s*currentElite\.name\s*\}\}"', r'alt="{{ currentElite.name | translate }}"')
          patch(elite_html, r"\{\{\s*quote\s*\}\}(?!\s*\|\s*translate)", r"{{ quote | translate }}")

          # Champion
          patch(champ_html, r"\{\{\s*champion\.name\s*\}\}(?!\s*\|\s*translate)", r"{{ champion.name | translate }}")
          patch(champ_html, r'alt="\{\{\s*champion\.name\s*\}\}"', r'alt="{{ champion.name | translate }}"')
          patch(champ_html, r"\{\{\s*quote\s*\}\}(?!\s*\|\s*translate)", r"{{ quote | translate }}")
          PY

      - name: Ensure Elite4/Champion name keys exist in EN i18n (only)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          python3 - << 'PY'
          import json, re
          from pathlib import Path

          root = Path.cwd()

          # Robust location for EN translations (your project uses public/i18n/en.json)
          candidates = [root / "public/i18n/en.json"] + list(root.glob("**/i18n/en.json"))
          en_path = next((p for p in candidates if p.exists()), None)
          if not en_path:
            raise SystemExit("ERROR: Could not find EN translation file (public/i18n/en.json or **/i18n/en.json)")

          data = json.loads(en_path.read_text(encoding="utf-8"))

          def set_dotted(obj, dotted, value):
            parts = dotted.split(".")
            cur = obj
            for p in parts[:-1]:
              if p not in cur or not isinstance(cur[p], dict):
                cur[p] = {}
              cur = cur[p]
            if parts[-1] not in cur or not cur[parts[-1]]:
              cur[parts[-1]] = value
              return True
            return False

          def humanize(ident: str) -> str:
            ident = ident.replace("-", " ").replace("_", " ")
            return " ".join(w[:1].upper() + w[1:] for w in ident.split() if w).strip()

          # Find every elite4.*.name and champion.*.name in TS source
          key_pat = re.compile(r"['\"]((?:elite4|champion)\.[a-z0-9_-]+\.name)['\"]", re.IGNORECASE)
          found = set()

          for p in root.rglob("*.ts"):
            s = p.read_text(encoding="utf-8", errors="ignore")
            for m in key_pat.finditer(s):
              found.add(m.group(1))

          changed = False
          for k in sorted(found):
            ident = k.split(".")[1]
            changed |= set_dotted(data, k, humanize(ident))

          if changed:
            en_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
            print(f"OK: updated {en_path} with missing elite4/champion keys.")
          else:
            print("OK: no missing elite4/champion keys.")

          # Print proof examples (2 elite4 + 2 champion)
          def get_dotted(obj, dotted):
            parts = dotted.split(".")
            cur = obj
            for p in parts:
              if not isinstance(cur, dict) or p not in cur:
                return None
              cur = cur[p]
            return cur

          examples = [
            "elite4.siebold.name",
            "elite4.malva.name",
            "champion.cynthia.name",
            "champion.diantha.name"
          ]
          print("Proof samples:")
          for ex in examples:
            print(f" - {ex} -> {get_dotted(data, ex)}")
          PY

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: npm install --legacy-peer-deps

      - name: Install @angular/localize (match Angular version)
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -e
          CORE_VER=$(node -p "require('./package.json').dependencies?.['@angular/core'] || require('./package.json').devDependencies?.['@angular/core'] || ''")
          if [ -z "$CORE_VER" ]; then
            echo "ERROR: Could not detect @angular/core version from package.json"
            exit 1
          fi
          CORE_VER="${CORE_VER#^}"
          CORE_VER="${CORE_VER#~}"
          npm install @angular/localize@$CORE_VER --legacy-peer-deps

      - name: Build (relative paths for GitHub Pages)
        working-directory: ${{ env.PROJECT_ROOT }}
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npm run build -- --configuration production --base-href "./" --deploy-url "./"

      - name: Locate index.html for Pages
        run: |
          set -e
          IDX="$(find "${{ env.PROJECT_ROOT }}/dist" -maxdepth 12 -type f -name index.html -print -quit)"
          if [ -z "$IDX" ]; then
            echo "ERROR: index.html not found in dist."
            exit 1
          fi
          PAGES_DIR="$(dirname "$IDX")"
          echo "PAGES_PATH=$PAGES_DIR" >> $GITHUB_ENV
          touch "$PAGES_DIR/.nojekyll"
          echo "Pages path: $PAGES_DIR"
          ls -la "$PAGES_DIR"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_PATH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
